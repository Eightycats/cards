<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Numbers</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --accent: #f0f0f0;
      --accent-hover: #e0e0e0;
      --border: #dddddd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --text-color: #ffffff;
        --accent: #333333;
        --accent-hover: #444444;
        --border: #3a3a3a;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 50px 12px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    h1 { text-align: center; font-size: 1.7rem; margin: 12px 0 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 700px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    .num-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--accent);
      border-radius: 10px;
      padding: 8px 4px;
      border: 1px solid var(--border);
    }

    .num-card .number {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .num-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin: 4px 0;
      border-radius: 6px;
    }

    .num-card .placeholder {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
      background: var(--accent-hover);
      border-radius: 6px;
      font-size: 1.1rem;
      color: var(--text-color);
      opacity: 0.6;
    }

    .num-card .peg-word {
      font-size: 0.8rem;
      text-align: center;
    }

    .highlight-letter {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>All Numbers</h1>
  <div class="grid" id="grid"></div>

  <script src="numbers-data.js"></script>
  <script>
    const grid = document.getElementById('grid');
    for (let i = 0; i <= 100; i++) {
      const card = document.createElement('div');
      card.className = 'num-card';

      const numDiv = document.createElement('div');
      numDiv.className = 'number';
      numDiv.textContent = i;
      card.appendChild(numDiv);

      if (i === 51) {
        const ph = document.createElement('div');
        ph.className = 'placeholder';
        ph.innerHTML = highlightConsonants(numberPegs[51]);
        card.appendChild(ph);
      } else {
        const img = document.createElement('img');
        img.src = getNumberImageSrc(i);
        img.alt = numberPegs[i];
        card.appendChild(img);
      }

      const wordDiv = document.createElement('div');
      wordDiv.className = 'peg-word';
      wordDiv.innerHTML = highlightConsonants(numberPegs[i]);
      card.appendChild(wordDiv);

      grid.appendChild(card);
    }
  </script>
  <script src="nav.js"></script>
</body>
</html>
