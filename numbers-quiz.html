<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz: Numbers to Images</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --accent: #f0f0f0;
      --accent-hover: #e0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --text-color: #ffffff;
        --accent: #333333;
        --accent-hover: #444444;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .score {
      margin-top: 50px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .number-display {
      font-size: 4rem;
      font-weight: 700;
      margin: 10px 0;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #feedback {
      font-size: 1.2rem;
      min-height: 30px;
      text-align: center;
    }

    .highlight-letter { font-weight: 700; }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 10px;
      max-width: 360px;
    }

    .image-grid img {
      width: 75px;
      height: 75px;
      object-fit: contain;
      border-radius: 6px;
      border: 3px solid transparent;
      cursor: pointer;
      background: var(--accent);
    }

    .image-grid img.correct { border-color: green; }
    .image-grid img.incorrect { border-color: red; }

    .final-screen {
      display: none;
      text-align: center;
      margin-top: 60px;
    }

    .final-screen .big-score {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 20px 0;
    }

    .final-screen button {
      padding: 12px 30px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: 1px solid var(--text-color);
      background: var(--accent);
      color: var(--text-color);
      cursor: pointer;
    }

    #quiz { text-align: center; }
  </style>
</head>
<body>
  <div class="score" id="score">Score: 0/0</div>

  <div id="quiz">
    <div class="number-display" id="numberDisplay"></div>
    <div id="feedback"></div>
    <div class="image-grid" id="imageOptions"></div>
  </div>

  <div class="final-screen" id="finalScreen">
    <div>Complete!</div>
    <div class="big-score" id="finalScore"></div>
    <button onclick="restartQuiz()">Restart</button>
  </div>

  <script src="numbers-data.js"></script>
  <script>
    let order = shuffleArray(numberList);
    let idx = 0;
    let correct = 0;
    let total = 0;

    function updateScore() {
      document.getElementById('score').textContent = `Score: ${correct}/${total}`;
    }

    function loadRound() {
      if (idx >= order.length) {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('finalScreen').style.display = 'block';
        document.getElementById('finalScore').textContent = `${correct} / ${order.length} correct`;
        return;
      }

      const current = order[idx];
      document.getElementById('numberDisplay').textContent = current;
      document.getElementById('feedback').innerHTML = '';

      const container = document.getElementById('imageOptions');
      container.innerHTML = '';

      const options = new Set([current]);
      while (options.size < 8) {
        const r = numberList[Math.floor(Math.random() * numberList.length)];
        options.add(r);
      }

      const shuffled = shuffleArray(Array.from(options));

      for (const num of shuffled) {
        const img = document.createElement('img');
        img.src = getNumberImageSrc(num);
        img.alt = numberPegs[num];
        img.onclick = () => handleSelection(img, num === current, current);
        container.appendChild(img);
      }
    }

    function handleSelection(img, isCorrect, current) {
      total++;
      if (isCorrect) {
        correct++;
        img.classList.add('correct');
        document.getElementById('feedback').textContent = '\u2705';
      } else {
        img.classList.add('incorrect');
        document.getElementById('feedback').innerHTML =
          '\u274c ' + highlightConsonants(numberPegs[current]);
      }
      updateScore();

      document.querySelectorAll('.image-grid img').forEach(i => i.onclick = null);

      idx++;
      setTimeout(loadRound, 2000);
    }

    function restartQuiz() {
      order = shuffleArray(numberList);
      idx = 0;
      correct = 0;
      total = 0;
      updateScore();
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('finalScreen').style.display = 'none';
      loadRound();
    }

    loadRound();
  </script>
  <script src="nav.js"></script>
</body>
</html>
