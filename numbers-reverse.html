<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz: Images to Numbers</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --accent: #f0f0f0;
      --accent-hover: #e0e0e0;
      --border: #dddddd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1e1e1e;
        --text-color: #ffffff;
        --accent: #333333;
        --accent-hover: #444444;
        --border: #3a3a3a;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .score {
      margin-top: 50px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    #quiz { text-align: center; }

    #pegImage {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin: 10px 0;
      border-radius: 10px;
    }

    .guess-display {
      min-height: 50px;
      margin: 4px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #answerInput {
      font-size: 2rem;
      font-weight: 700;
      width: 80px;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--accent);
      color: var(--text-color);
      padding: 6px;
    }

    #goBtn {
      font-size: 1.1rem;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--text-color);
      cursor: pointer;
      font-weight: 600;
    }

    #goBtn:hover { background: var(--accent-hover); }

    #feedback {
      font-size: 1.1rem;
      min-height: 28px;
      text-align: center;
    }

    .highlight-letter { font-weight: 700; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 6px 0;
      padding: 0 10px;
    }

    .btn-row button {
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--text-color);
      min-width: 44px;
      cursor: pointer;
    }

    .btn-row button:hover { background: var(--accent-hover); }
    .btn-row button.selected { background: var(--accent-hover); font-weight: 700; }

    .final-screen {
      display: none;
      text-align: center;
      margin-top: 60px;
    }

    .final-screen .big-score {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 20px 0;
    }

    .final-screen button {
      padding: 12px 30px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: 1px solid var(--text-color);
      background: var(--accent);
      color: var(--text-color);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="score" id="score">Score: 0/0</div>

  <div id="quiz">
    <img id="pegImage" src="" alt="Peg" />
    <div class="guess-display" id="guessDisplay">
      <input type="text" id="answerInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="?" />
      <button id="goBtn" onclick="submitAnswer()">Go</button>
    </div>
    <div id="feedback"></div>

    <div class="btn-row" id="digitRow"></div>
  </div>

  <div class="final-screen" id="finalScreen">
    <div>Complete!</div>
    <div class="big-score" id="finalScore"></div>
    <button onclick="restartQuiz()">Restart</button>
  </div>

  <script src="numbers-data.js"></script>
  <script>
    let order = shuffleArray(numberList);
    let idx = 0;
    let correct = 0;
    let total = 0;
    let answered = false;

    const answerInput = document.getElementById('answerInput');

    function buildButtons() {
      const digitRow = document.getElementById('digitRow');
      for (let i = 0; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.onclick = () => appendDigit(i);
        digitRow.appendChild(btn);
      }
    }

    function appendDigit(d) {
      if (answered) return;
      answerInput.value += d;
      answerInput.focus();
    }

    // Only allow numeric input
    answerInput.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
    });

    // Submit on Enter key
    answerInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      }
    });

    function submitAnswer() {
      if (answered) return;
      const val = answerInput.value.trim();
      if (val === '') return;
      const guess = parseInt(val, 10);
      checkAnswer(guess, order[idx]);
    }

    function updateScore() {
      document.getElementById('score').textContent = `Score: ${correct}/${total}`;
    }

    function loadRound() {
      if (idx >= order.length) {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('finalScreen').style.display = 'block';
        document.getElementById('finalScore').textContent = `${correct} / ${order.length} correct`;
        return;
      }

      const current = order[idx];
      document.getElementById('pegImage').src = getNumberImageSrc(current);
      answerInput.value = '';
      answerInput.placeholder = '?';
      document.getElementById('feedback').innerHTML = '';
      answered = false;

      enableButtons(true);
      answerInput.disabled = false;
      answerInput.focus();
    }

    function enableButtons(on) {
      document.querySelectorAll('#digitRow button').forEach(b => {
        b.disabled = !on;
      });
      document.getElementById('goBtn').disabled = !on;
    }

    function checkAnswer(guess, current) {
      answered = true;
      total++;
      enableButtons(false);
      answerInput.disabled = true;
      answerInput.value = current;

      if (guess === current) {
        correct++;
        document.getElementById('feedback').textContent = '\u2705';
      } else {
        document.getElementById('feedback').innerHTML =
          '\u274c ' + current + ' = ' + highlightConsonants(numberPegs[current]);
      }
      updateScore();

      idx++;
      setTimeout(loadRound, 2000);
    }

    function restartQuiz() {
      order = shuffleArray(numberList);
      idx = 0;
      correct = 0;
      total = 0;
      updateScore();
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('finalScreen').style.display = 'none';
      loadRound();
    }

    buildButtons();
    loadRound();
  </script>
  <script src="nav.js"></script>
</body>
</html>
